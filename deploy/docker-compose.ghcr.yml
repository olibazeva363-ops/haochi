# =============================================================================
# TokenHub 服务器部署（GHCR 镜像 + Watchtower 自动更新）
# =============================================================================
# 用法（在服务器上）：
#   1. cp .env.deploy.example .env  然后填好里面的密钥/密码
#   2. docker login ghcr.io   （用户名=GitHub 用户名，密码=read:packages 的 PAT）
#   3. docker compose -f docker-compose.ghcr.yml up -d
#
# 之后每次 push main → Actions 构建新 :latest → Watchtower 每 60s 检查一次，
# 发现新镜像自动拉取并重启 app（只更新带 watchtower.enable 标签的容器）。
# =============================================================================

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/olibazeva363-ops/haochi:latest}
    container_name: tokenhub-app
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    # 只绑本机回环，对外统一走 Nginx（80/443）
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-release}
      - SERVER_FRONTEND_URL=${SERVER_FRONTEND_URL:-}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-tokenhub}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_DBNAME=${POSTGRES_DB:-tokenhub}
      - DATABASE_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@tokenhub.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [tokenhub]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    container_name: tokenhub-postgres
    restart: unless-stopped
    volumes:
      # PostgreSQL 18+ 约定：单挂载点在 /var/lib/postgresql（数据落到子目录）
      - ./postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-tokenhub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-tokenhub}
      - TZ=${TZ:-Asia/Shanghai}
    networks: [tokenhub]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tokenhub} -d ${POSTGRES_DB:-tokenhub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: tokenhub-redis
    restart: unless-stopped
    volumes:
      - ./redis_data:/data
    command: >
      sh -c '
        redis-server \
        --save 60 1 \
        --appendonly yes \
        --appendfsync everysec \
        ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    networks: [tokenhub]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 自动更新器：监视带 watchtower.enable 标签的容器，发现新镜像即拉取重启
  watchtower:
    image: containrrr/watchtower
    container_name: tokenhub-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 用于拉取私有 GHCR 镜像：服务器先 `docker login ghcr.io` 生成该文件
      - ${DOCKER_CONFIG_DIR:-~/.docker}/config.json:/config.json:ro
    command: --interval 60 --cleanup --label-enable
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    networks: [tokenhub]

  # 反向代理 + TLS 终止（Let's Encrypt）
  nginx:
    image: nginx:1.27-alpine
    container_name: tokenhub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks: [tokenhub]
    # 每 6h reload 一次，拾取 certbot 续期后的新证书
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  # 证书签发 + 自动续期（每 12h 检查一次；续期写入共享卷，nginx 定时 reload 拾取）
  certbot:
    image: certbot/certbot
    container_name: tokenhub-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

networks:
  tokenhub:
    driver: bridge
