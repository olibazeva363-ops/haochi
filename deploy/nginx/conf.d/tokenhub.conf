# TokenHub 反向代理 + TLS 终止
# 说明：app 更新（Watchtower）后容器 IP 会变，故用 docker 内嵌 DNS(127.0.0.11)
# 动态解析 upstream，避免 nginx 缓存旧 IP 导致 502。

map $http_upgrade $connection_upgrade {
    default upgrade;
    # Keep ordinary HTTP/SSE upstream connections reusable. Sending
    # Connection: close here forced a fresh app-side TCP connection per request.
    ''      '';
}

server {
    listen 80;
    server_name fangwaizhijing.com;

    # Let's Encrypt HTTP-01 校验
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余一律跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name fangwaizhijing.com;

    ssl_certificate     /etc/letsencrypt/live/fangwaizhijing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fangwaizhijing.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $tokenhub_upstream http://app:8080;
        proxy_pass $tokenhub_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（OpenAI WS 透传等）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE / 流式：关缓冲、长超时
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_socket_keepalive  on;
        proxy_connect_timeout   75s;
        proxy_read_timeout      24h;
        proxy_send_timeout      24h;
        send_timeout            24h;
    }
}
